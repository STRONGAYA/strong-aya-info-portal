# Simple workflow for deploying static content to GitHub Pages
name: Deploy static web content to Pages

on:
  # Allows one to run this workflow manually from the repository's 'Actions' tab
  workflow_dispatch:

  # TEMPORARILY DISABLED: trigger on completion of the Vantage6 data-fetching
  # integration. The site is currently built solely from the data committed in
  # the repo (see the "Sync flashcard data into web" step below).
  # Re-enable this block to couple deployments to the data updates again.
  # workflow_run:
  #   workflows: [ "Update data through Vantage6 integration" ]
  #   types:
  #     - completed
  #   branches: [ "main" ]

    # Trigger the workflow on push to the /web directory on the main branch
  push:
    branches: [ "main" ]
    paths:
      - 'web/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # TEMPORARILY on a GitHub-hosted runner; switch back to the self-hosted
    # runner when the data-fetching integration is re-enabled:
    # runs-on: [ self-hosted, SURF ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # The portal reads its flashcard CSVs from web/data; copy the latest
      # generated flashcards (see update_data.yml) in before publishing
      - name: Sync flashcard data into web
        run: |
          mkdir -p web/data
          cp -f data/flashcards/*.csv web/data/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
