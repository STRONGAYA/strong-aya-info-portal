# Translates the portal with DeepL at build time (scripts/translate_site.py, docs/plan_deepl_translation.md)
# and keeps the generated page trees (web/<lang>/), strings (web/i18n/<lang>.js), web/i18n/languages.js
# and the hreflang links of the English pages up to date.
#
# On main: new machine translations go into a pull request on a translations/<date> branch (so that a
# reviewer can correct translations/<lang>.json before they are published); output that only re-applies
# translations the cache already had is committed directly and the site is redeployed.
# On a translations/* branch (the review pull requests): the regenerated output is committed to the branch.
# On pull requests: a check that the generated files match what the cache produces, no DeepL key needed.
#
# The DeepL key lives only in the repository secret DEEPL_AUTH_KEY, inside this job. Without the secret
# the script only regenerates from the cache: nothing is translated, and visitors can translate the
# English pages with their browser (see README.md).
name: Translate the site with DeepL

on:
  # Allows one to run this workflow manually from the repository's 'Actions' tab
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to add or translate, comma-separated codes (e.g. nl,fr); empty = the languages that have a cache in translations/'
        required: false
        type: string
      mode:
        description: 'translate (uses the DeepL key), dry-run (only count what DeepL would bill) or check'
        required: false
        default: translate
        type: choice
        options:
          - translate
          - dry-run
          - check

  # The English sources or the translation cache changed
  push:
    branches:
      - main
      - 'translations/**'
    paths:
      - 'web/**'
      - 'translations/**'
      - 'scripts/translate_site.py'

  pull_request:
    paths:
      - 'web/**'
      - 'translations/**'
      - 'scripts/translate_site.py'

permissions:
  contents: write
  pull-requests: write
  actions: write

# One translation run at a time: two runs would both write the cache and the trees
concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  # Nobody edits generated files by hand, and a reviewed cache is regenerated before it is merged. The
  # review branches (translations/*) are regenerated by the translate job on every push, so they are
  # not checked a second time here (a push made with the workflow token would not re-run this check).
  check:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'translations/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the generated translations against the cache (standard library only)
        run: python scripts/translate_site.py --check

  translate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Translates the units the cache does not have yet (when the key is set) and writes the trees;
      # with mode dry-run or check nothing is written
      - name: Run the translation script
        id: translate
        env:
          DEEPL_AUTH_KEY: ${{ secrets.DEEPL_AUTH_KEY }}
          LANGUAGES: ${{ github.event.inputs.languages }}
          MODE: ${{ github.event.inputs.mode || 'translate' }}
        run: |
          args=""
          if [ -n "$LANGUAGES" ]; then args="--languages $LANGUAGES"; fi
          case "$MODE" in
            dry-run) args="$args --dry-run" ;;
            check) args="$args --check" ;;
          esac
          python scripts/translate_site.py $args 2>&1 | tee translate.log
          test "${PIPESTATUS[0]}" -eq 0
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        timeout-minutes: 30

      # The translated page trees, for previewing a language before it is merged
      - name: List the generated page trees
        id: trees
        if: steps.translate.outputs.mode == 'translate'
        run: |
          {
            echo 'paths<<EOF'
            for cache in translations/*.json; do
              lang=$(basename "$cache" .json)
              case "$lang" in config|glossary) continue ;; esac
              if [ -d "web/$lang" ]; then echo "web/$lang"; echo "web/i18n/$lang.js"; fi
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the translated pages as an artifact
        if: steps.translate.outputs.mode == 'translate' && steps.trees.outputs.paths != ''
        uses: actions/upload-artifact@v4
        with:
          name: translated-pages
          path: ${{ steps.trees.outputs.paths }}
          if-no-files-found: ignore

      - name: Configure Git
        if: steps.translate.outputs.mode == 'translate'
        run: |
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git config --global user.name "${{ github.actor }}"

      # What changed: new entries in the cache (translations/<lang>.json) need a review, so they go into
      # a pull request; regenerated output alone is committed directly and the site redeployed (a push
      # made with the workflow token does not trigger the deployment workflow by itself)
      - name: Commit, push and redeploy, or open a pull request
        if: steps.translate.outputs.mode == 'translate'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A web translations
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          cache_changed=$(git diff --cached --name-only -- 'translations/*.json' | grep -v -e 'translations/config.json' -e 'translations/glossary.json' || true)
          summary=$(grep -E ' characters billed$|^available languages:|^DEEPL_AUTH_KEY is not set' translate.log || true)
          if [ "${GITHUB_REF#refs/heads/}" != "main" ]; then
            # a review branch: keep the regenerated output on the branch itself
            git commit -m "Regenerate the translated pages from the reviewed cache"
            git push
          elif [ -n "$cache_changed" ]; then
            branch="translations/$(date +%Y-%m-%d-%H%M)"
            git checkout -b "$branch"
            git commit -m "Add machine translations from DeepL for review"
            git push --set-upstream origin "$branch"
            gh pr create --base main --head "$branch" \
              --title "Review the DeepL translations of $(date +%Y-%m-%d)" \
              --body "$(printf 'New machine translations in:\n\n%s\n\nFrom the translation run:\n\n```\n%s\n```\n\nReviewers: correct `target` in `translations/<lang>.json` (or use `--export-review`/`--import-review`) and set `status` to `reviewed`; a push to this branch regenerates the pages. The translated pages of this run are attached to the workflow run as the artifact `translated-pages`.' "$cache_changed" "$summary")"
          else
            git commit -m "Regenerate the translated pages"
            git push
            gh workflow run publish_web.yml --ref main
          fi
